name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Ohne Verlauf und Marken findet der Nachrüst-Prüflauf das Schema
          # der letzten Fassung nicht.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typen prüfen
        run: npm run typecheck

      - name: Bauen
        run: npm run build

      # Kein continue-on-error: der Lauf setzt einen echten Exit-Code (siehe
      # Kopf von scripts/deutsch-finden.mjs, Abschnitt SCHWELLE). Das ist kein
      # "irgendein Fund → rot" mehr, sondern ein Ratchet gegen
      # scripts/deutsch-schwelle.json: bestehender Rückstand ist geduldet,
      # aber JEDE Datei mit mehr Funden als dort hinterlegt blockt sofort.
      # Fehlt die Schwelle-Datei (z. B. weil sie nicht committet wurde),
      # blockt der Lauf ebenso — bewusst, siehe dort. Der Workflow selbst
      # braucht dafür nichts Zusätzliches: dieselbe einfache "run und Exit-Code
      # zählt"-Regel wie bei jedem anderen Schritt hier reicht bereits aus.
      - name: Keine fest verdrahteten Texte
        run: node scripts/deutsch-finden.mjs

      # Derselbe Ratchet-Gedanke, nur eine Ebene tiefer: deutsch-finden.mjs
      # bewacht Texte, die gar nicht erst im Wörterbuch stehen — dieser Lauf
      # bewacht die WERTE der 22 Wörterbücher selbst (feste Sprachnennung,
      # deutsches Kürzel, gemischte Sprachvariante, gemischte Anrede). Beides
      # zusammen deckt erst die ganze Strecke ab; sprachen-vollstaendig.mjs
      # vergleicht nur Schlüsselmengen und liest keinen einzigen Wert.
      - name: Wörterbücher inhaltlich stimmig
        run: node scripts/woerterbuecher-stimmigkeit-pruefen.mjs

      # Die Fernsteuerung des Pi: mehrere Zuschauer, einer steuert, und eine
      # Verbindung, die ohne Abmeldung abreißt, gibt ihren Platz frei. Genau
      # das war kaputt und hat einen halben Tag gekostet — und es fiel nicht
      # auf, weil an dem Dienst nie etwas geprüft wurde. Läuft ohne Pi und
      # ohne Compositor gegen einen nachgemachten Abgreifer, in Sekunden.
      - name: Mehrere sehen dem Pi zu
        run: node scripts/fern-mehrere-pruefen.mjs

      - name: Server startet und antwortet
        run: |
          cd packages/server
          node --experimental-sqlite dist/index.js &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8787/api/health && break
            sleep 2
          done
          curl -sf http://localhost:8787/api/health | grep -q '"ok":true'

      # Der eigentliche Grund für diese Datei: Ein frisch angelegter Server
      # kommt immer hoch — dort bringt CREATE TABLE jede neue Spalte gleich
      # mit. Draußen gibt es die Tabellen schon, und dort zählt allein
      # db/migrate.ts. Fassung 1.0.17 ist genau daran gescheitert
      # ("no such column: projekt_id") und musste zurückgenommen werden.
      #
      # Braucht die Fassungsmarken, deshalb fetch-depth: 0 oben.
      - name: Server kommt auf einer alten Datenbank hoch
        run: node scripts/e2e-nachruesten.mjs
